name: rudstock

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rudstock
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: rudstock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rudstock -d rudstock"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: